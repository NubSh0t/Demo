<!-- Ai generated html for good notes frontend ui -->

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notes API Console</title>
  <style>
    :root { --ink:#18212b; --muted:#687482; --paper:#f7f4ed; --panel:#fffdf8; --line:#ded8cc; --blue:#2364aa; --dark:#174779; --green:#24724d; --red:#b3423c; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:radial-gradient(circle at 10% 0%, #e8f0f4 0, transparent 34%), var(--paper); font:15px/1.5 Georgia, "Times New Roman", serif; }
    button,input { font:inherit; } button { cursor:pointer; }
    .shell { width:min(920px, calc(100% - 32px)); margin:auto; padding:48px 0 64px; }
    header { margin-bottom:28px; }
    .eyebrow { margin:0 0 8px; color:var(--blue); font:700 12px/1.2 Arial,sans-serif; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(34px, 6vw, 62px); line-height:.98; font-weight:500; } h2 { margin:0 0 18px; font-size:24px; font-weight:500; }
    .intro { max-width:560px; margin:16px 0 0; color:var(--muted); }
    .panel { padding:24px; background:rgba(255,253,248,.88); border:1px solid var(--line); box-shadow:0 18px 55px rgba(31,43,54,.1); }
    .form-grid { display:grid; grid-template-columns:1fr auto; gap:10px; } input { width:100%; padding:12px 13px; color:var(--ink); background:#fff; border:1px solid #c9c5bc; border-radius:3px; }
    input:focus { outline:3px solid rgba(35,100,170,.18); border-color:var(--blue); } button { padding:11px 15px; color:#fff; background:var(--blue); border:0; border-radius:3px; font:700 13px Arial,sans-serif; } button:hover { background:var(--dark); }
    button.secondary { color:var(--dark); background:#e5edf4; } button.danger { background:var(--red); }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; } .hint { margin:10px 0 0; color:var(--muted); font-size:13px; }
    .status { min-height:26px; margin:16px 0 0; font:13px Arial,sans-serif; } .success { color:var(--green); } .error { color:var(--red); }
    .notes { display:grid; gap:9px; margin-top:18px; } .note { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px; background:#fff; border:1px solid var(--line); }
    .note-meta { display:flex; align-items:baseline; gap:12px; } .note-number { color:var(--ink); font:700 13px Arial,sans-serif; } .note-id { color:var(--blue); font:12px Arial,sans-serif; } .note-text { margin-top:5px; }
    .list-heading { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:30px; } .list-heading h2 { margin:0; }
    @media (max-width:760px) { .shell { padding-top:30px; } .form-grid { grid-template-columns:1fr; } .note { align-items:start; } .note-meta { display:block; } .note-id { display:block; margin-top:3px; } }
  </style>
</head>
<body>
  <main class="shell">
    <header><p class="eyebrow">Notes workspace</p><h1>My notes</h1><p class="intro">Create a note, browse the full list, or use an ID to focus on one note at a time.</p></header>
    <section class="panel">
      <h2>Request a note</h2>
      <div class="form-grid"><input id="text" type="text" placeholder="Write a note..." aria-label="Note text"><button id="create">Create note</button></div>
      <div class="actions"><button class="secondary" id="refresh">Get all notes</button><button class="secondary" id="get-one">Get note by ID</button><button class="secondary" id="update">Update note</button><button class="danger" id="delete">Delete note</button></div>
      <p class="hint">Note ID: <input id="note-id" type="number" min="1" placeholder="ID" aria-label="Note ID" style="width:105px;padding:5px 7px"> Select a note below to fill its ID.</p>
      <p id="status" class="status" role="status"></p>
      <div class="list-heading"><h2 id="list-title">All notes</h2><span id="list-count" class="hint"></span></div>
      <div id="notes" class="notes" aria-live="polite"></div>
    </section>
  </main>
  <script>
    const textInput = document.querySelector('#text');
    const idInput = document.querySelector('#note-id');
    const status = document.querySelector('#status');
    const notesElement = document.querySelector('#notes');
    const listTitle = document.querySelector('#list-title');
    const listCount = document.querySelector('#list-count');
    let allNotes = [];
    let visibleNotes = [];
    let showingSingleNote = false;

    async function request(method, path, body) {
      const options = { method, headers: { 'Content-Type': 'application/json' } };
      if (body !== undefined) options.body = JSON.stringify(body);
      const response = await fetch(path, options);
      return { response, data: await response.json() };
    }
    function showStatus(message, isError = false) { status.textContent = message; status.className = `status ${isError ? 'error' : 'success'}`; }
    function escapeHtml(value) { return value.replace(/[&<>'"]/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[character])); }
    function renderNotes(notes) {
      visibleNotes = notes;
      listTitle.textContent = showingSingleNote ? 'Selected note' : 'All notes';
      listCount.textContent = `${notes.length} ${notes.length === 1 ? 'note' : 'notes'}`;
      notesElement.innerHTML = notes.length ? notes.map(note => `<article class="note"><div><div class="note-meta"><span class="note-number">Note ${note.id}</span><span class="note-id">ID: ${note.id}</span></div><div class="note-text">${escapeHtml(note.text)}</div></div><button class="secondary select" data-id="${note.id}">Select</button></article>`).join('') : '<p class="hint">No notes to show.</p>';
      notesElement.querySelectorAll('.select').forEach(button => button.addEventListener('click', () => { idInput.value = button.dataset.id; }));
    }
    async function refreshNotes() {
      const { data } = await request('GET', '/notes');
      allNotes = data.notes || [];
      showingSingleNote = false;
      renderNotes(allNotes);
      showStatus(`${allNotes.length} ${allNotes.length === 1 ? 'note' : 'notes'} loaded.`);
    }
    function getId() {
      const id = Number(idInput.value);
      if (!Number.isInteger(id) || id < 1) throw new Error('Enter a valid note ID first.');
      return id;
    }
    async function createNote() {
      try {
        const { response, data } = await request('POST', '/notes', { text: textInput.value });
        if (!response.ok) throw new Error(data.message);
        allNotes = data.notes || allNotes;
        showingSingleNote = false;
        renderNotes(allNotes);
        textInput.value = '';
        showStatus(`Note ${data.notes[data.notes.length - 1].id} created.`);
      } catch (error) { showStatus(error.message, true); }
    }
    async function getNote() {
      try {
        const id = getId();
        const { response, data } = await request('GET', `/notes/${id}`);
        if (!response.ok) throw new Error(data.message);
        showingSingleNote = true;
        renderNotes([data.note]);
        showStatus(`Showing note ${id}.`);
      } catch (error) { showStatus(error.message, true); }
    }
    async function updateNote() {
      try {
        const id = getId();
        const { response, data } = await request('PUT', `/notes/${id}`, { text: textInput.value });
        if (!response.ok) throw new Error(data.message);
        allNotes = data.notes || allNotes;
        const updated = allNotes.find(note => note.id === id);
        if (showingSingleNote) renderNotes(updated ? [updated] : []); else renderNotes(allNotes);
        showStatus(`Note ${id} updated.`);
      } catch (error) { showStatus(error.message, true); }
    }
    async function deleteNote() {
      try {
        const id = getId();
        const { response, data } = await request('DELETE', `/notes/${id}`);
        if (!response.ok) throw new Error(data.message);
        allNotes = allNotes.filter(note => note.id !== id);
        renderNotes(showingSingleNote ? [] : allNotes);
        idInput.value = '';
        showStatus(`Note ${id} deleted.`);
      } catch (error) { showStatus(error.message, true); }
    }
    document.querySelector('#create').addEventListener('click', createNote);
    document.querySelector('#refresh').addEventListener('click', () => refreshNotes().catch(error => showStatus(error.message, true)));
    document.querySelector('#get-one').addEventListener('click', getNote);
    document.querySelector('#update').addEventListener('click', updateNote);
    document.querySelector('#delete').addEventListener('click', deleteNote);
    refreshNotes().catch(error => showStatus(`Cannot connect to API: ${error.message}`, true));
  </script>
</body>
</html>
